<g transform="translate(113 598)"><path d="M-3 0h6v74h-6Z" fill="#c1b292" stroke="#665c46"/><path d="M-3 3h6v17h-6Zm0 34h6v17h-6Z" fill="#a86143"/><path d="M-11 74q12-5 23 1" stroke="#574d38" stroke-width="3"/><path d="M-3 0L31 4 5 17H-3Z" fill="#d79b5c" opacity=".8"/></g>

<div class="footer"><p class="caption">一个挖掘机在持续挖土装载到一台卡车，越真实越好</p><div class="controls"><button id="pause" type="button" aria-label="暂停动画" title="暂停 / 播放"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="pauseIcon" d="M4 2V12M10 2V12" stroke="currentColor" stroke-width="2"/></svg></button><button class="speed" id="speed" type="button" aria-label="调整动画速度">1×</button></div></div>
<div class="note"><span>挖掘 → 收斗 → 提升 → 卸载 → 回转</span><div><span>连续循环 · 独立 SVG 动画</span><div class="progress"><span id="progress"></span></div></div></div>
</main>
<script>
'use strict';
// A two-link inverse-kinematic rig keeps all joints, hoses and piston ends attached.
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
function make(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}
const P={x:465,y:468},L1=285,L2=235;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t*t*(3-2*t), mix=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
const xy=p=>`${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
function line(id,a,b){$(id).setAttribute('d',`M${xy(a)}L${xy(b)}`)}
function offset(p,angle,x,y){return{x:p.x+x*Math.cos(angle)-y*Math.sin(angle),y:p.y+x*Math.sin(angle)+y*Math.cos(angle)}}
let randomSeed=1432;
function rnd(){randomSeed=(Math.imul(randomSeed,1664525)+1013904223)>>>0;return randomSeed/4294967296}
for(let i=0;i<155;i++){const x=35+rnd()*1370,y=577+rnd()*209,r=1+rnd()*4;make('path',{d:`M${x} ${y}l${r*1.8} ${-r*.7} ${r*1.5} ${r} ${-r*1.7} ${r*.8}Z`,fill:['#6a583e','#b69b73','#8b714d'][i%3],opacity:.25+rnd()*.4},$('groundStones'))}
const loadPebbles=[];for(let i=0;i<40;i++)loadPebbles.push({node:make('ellipse',{rx:2+rnd()*4,ry:1+rnd()*2,fill:i%3?'#645036':'#ad8b5c'},$('loadStones')),x:842+rnd()*318,y:rnd()});
const grains=[];for(let i=0;i<95;i++)grains.push({node:make('path',{d:'M-3-2L2-3 4 1 0 4-3 1Z',fill:['#765438','#977044','#514330','#b08a57'][i%4]},$('fallingSoil')),seed:rnd(),spread:rnd(),size:.4+rnd()*1.2});
const puffs=[];for(let i=0;i<18;i++)puffs.push({node:make('ellipse',{fill:'url(#dust)'},$('airDust')),seed:rnd(),side:rnd()-.5});
const keys=[
{t:0,x:736,y:574,a:20,f:0},{t:.10,x:744,y:597,a:27,f:0},
{t:.245,x:682,y:578,a:-58,f:1},{t:.40,x:706,y:365,a:-55,f:1},
{t:.56,x:909,y:350,a:-38,f:1},{t:.615,x:909,y:351,a:-28,f:1},
{t:.69,x:909,y:355,a:67,f:.25},{t:.735,x:909,y:355,a:76,f:0},
{t:.80,x:873,y:342,a:6,f:0},{t:.91,x:747,y:433,a:18,f:0},
{t:1,x:736,y:574,a:20,f:0}
];
function pose(t){let i=0;while(i<keys.length-2&&t>keys[i+1].t)i++;const a=keys[i],b=keys[i+1],u=ease(clamp((t-a.t)/(b.t-a.t)));return{x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),a:lerp(a.a,b.a,u)*Math.PI/180,f:lerp(a.f,b.f,u)}}
function rig(q,time){const W={x:q.x,y:q.y},dx=W.x-P.x,dy=W.y-P.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));const E=offset(P,a,L1,0),b=Math.atan2(W.y-E.y,W.x-E.x);
const bend=offset(P,a,L1*.51,-24);$('boomBack').setAttribute('d',`M${xy(P)}Q${xy(bend)} ${xy(E)}`);$('boom').setAttribute('d',`M${xy(P)}Q${xy(bend)} ${xy(E)}`);
$('boomHighlight').setAttribute('d',`M${xy(offset(P,a,10,-13))}Q${xy(offset(P,a,L1*.51,-38))} ${xy(offset(E,a,-12,-13))}`);
line('stickBack',E,W);line('stick',E,W);line('stickHighlight',offset(E,b,10,-8),offset(W,b,-15,-8));
const m0={x:457,y:508},m1=offset(P,a,193,8),s0=offset(P,a,155,-24),s1=offset(E,b,91,-14),c0=offset(E,b,79,15),c1=offset(W,q.a,1,-23);
line('mainRod',m0,m1);line('mainCylinder',m0,mix(m0,m1,.57));line('mainCylinderEdge',m0,mix(m0,m1,.54));line('stickRod',s0,s1);line('stickCylinder',s0,mix(s0,s1,.57));line('stickCylinderEdge',s0,mix(s0,s1,.54));line('curlRod',c0,c1);line('curlCylinder',c0,mix(c0,c1,.55));
const h0=offset(P,a,10,-25),h1=offset(E,a,-15,-22),h2=offset(E,b,38,-17),h3=offset(W,b,-45,-15);
$('hose').setAttribute('d',`M444 493Q422 449 ${xy(h0)}L${xy(h1)}Q${xy(offset(E,b,10,-40))} ${xy(h2)}L${xy(h3)}`);
$('hoseFine').setAttribute('d',`M451 490Q430 446 ${xy(offset(P,a,17,-30))}L${xy(offset(E,a,-10,-28))}`);
$('elbowPin').setAttribute('cx',E.x);$('elbowPin').setAttribute('cy',E.y);$('wristPin').setAttribute('cx',W.x);$('wristPin').setAttribute('cy',W.y);
$('bucket').setAttribute('transform',`translate(${q.x} ${q.y}) rotate(${q.a*180/Math.PI})`);$('bucketSoil').setAttribute('opacity',q.f);$('bucketSoil').setAttribute('transform',`scale(1 ${.6+.4*q.f})`);
$('upperBody').setAttribute('transform',`translate(0 ${Math.sin(time*25)*.24})`);$('beacon').setAttribute('opacity',.55+.45*Math.pow(Math.sin(time*4),6));
$('exhaust').setAttribute('transform',`translate(${Math.sin(time)*3} ${-((time*9)%18)})`);return W;
}
// Six bucket passes fill the truck. Departure and arrival are part of the same timeline.
const cycleDuration=12,workDuration=72,exchangeDuration=9,totalDuration=81;
function truckState(local,time){let tx=0,load=0,bounce=0;
if(local<workDuration){const pass=Math.floor(local/cycleDuration),t=(local%cycleDuration)/cycleDuration;load=(pass+clamp((t-.635)/.115))/6;bounce=t>.65&&t<.79?Math.sin((t-.65)*100)*Math.exp(-(t-.65)*22)*1.1:0;}
else{const u=(local-workDuration)/exchangeDuration;if(u<.47){tx=1650*(u/.47)**1.7;load=1;}else{tx=-1550*(1-ease(clamp((u-.49)/.5)));load=0;}bounce=Math.sin(time*20)*.7*Math.min(1,Math.abs(tx)/100);}
$('truck').setAttribute('transform',`translate(${tx.toFixed(2)} 0)`);$('truckSuspension').setAttribute('transform',`translate(0 ${bounce.toFixed(2)})`);
const base=clamp(load),crest=473-base*62;
$('truckSoil').setAttribute('d',`M827 486L832 ${482-base*9}Q855 ${467-base*32} 879 ${472-base*33}Q918 ${crest-10} 962 ${crest+3}Q1010 ${crest-13} 1051 ${crest+7}Q1100 ${crest-6} 1157 ${475-base*26}L1188 482V545H827Z`);
for(const peb of loadPebbles){const hump=Math.sin((peb.x-832)/356*Math.PI);peb.node.setAttribute('cx',peb.x);peb.node.setAttribute('cy',480-base*12-hump*base*53+peb.y*11);peb.node.setAttribute('opacity',base>.05?.8:0);}
const wheels=$('truckWheels').children;for(let i=0;i<wheels.length;i++){const cx=[867,1004,1267][i];wheels[i].setAttribute('transform',`rotate(${tx/49*180/Math.PI} ${cx} 603)`)}
$('load').textContent=String(Math.round(load*100)).padStart(2,'0');return{load,tx};}
function particles(t,time,active){const start=.635,end=.748,tail=.055;
for(let i=0;i<grains.length;i++){const g=grains[i],period=.092,age=((t-start-g.seed*period)%period+period)%period,emitted=t-age;
const visible=active&&t>=start&&t<end+tail&&emitted>=start&&emitted<end;
if(!visible){g.node.setAttribute('opacity',0);continue;}
const q=pose(emitted),mouth=offset({x:q.x,y:q.y},q.a,63,25),seconds=age*cycleDuration,vx=(g.spread-.5)*58;
const x=mouth.x+vx*seconds,y=mouth.y+12*seconds+260*seconds*seconds;
const bedHeight=455;
if(y>bedHeight+5){g.node.setAttribute('opacity',0);continue;}
g.node.setAttribute('transform',`translate(${x} ${y}) rotate(${seconds*160+i*31}) scale(${g.size})`);g.node.setAttribute('opacity',.95);}
const digging=active&&t>.10&&t<.29,dumping=active&&t>.65&&t<.83;
for(let i=0;i<puffs.length;i++){const p=puffs[i],age=((time*.72+p.seed)%1),du=dumping&&i<11,di=digging&&i>=11;if(!du&&!di){p.node.setAttribute('opacity',0);continue;}
const x=(du?935:711)+p.side*(du?95:130)*age+age*27,y=(du?458:628)-age*(du?48:33);
p.node.setAttribute('cx',x);p.node.setAttribute('cy',y);p.node.setAttribute('rx',12+age*52);p.node.setAttribute('ry',7+age*20);p.node.setAttribute('opacity',Math.sin(age*Math.PI)*(du?.7:.9));}
}
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,elapsed=0,last=null;
function render(){const local=elapsed%totalDuration,active=local<workDuration,t=active?(local%cycleDuration)/cycleDuration:0;
const q=active?pose(t):{x:758,y:359,a:-.5,f:0};rig(q,elapsed);truckState(local,elapsed);particles(t,elapsed,active);
const phase=active?(t<.1?'切入土层':t<.245?'收斗挖掘':t<.4?'负载提升':t<.615?'移至车斗':t<.755?'翻斗卸土':t<.91?'空斗返回':'下降就位'):(local<76.2?'满载驶离':'空车就位');
$('phase').textContent=phase;$('cycle').textContent=String(Math.floor(elapsed/totalDuration)*6+Math.min(6,Math.floor(local/cycleDuration)+1)).padStart(2,'0');$('progress').style.width=(active?t*100:(local-72)/9*100)+'%';
$('digCut').setAttribute('transform',`translate(0 ${active&&t>.1&&t<.25?Math.sin((t-.1)/.15*Math.PI)*3:0})`);
}
function updateButton(){$('pause').setAttribute('aria-label',paused?'播放动画':'暂停动画');$('pause').setAttribute('aria-pressed',String(paused));$('pauseIcon').setAttribute('d',paused?'M4 2L12 7 4 12Z':'M4 2V12M10 2V12');$('pauseIcon').setAttribute('fill',paused?'currentColor':'none');$('pauseIcon').setAttribute('stroke-width',paused?'1':'2');}
$('pause').addEventListener('click',()=>{paused=!paused;updateButton()});
$('speed').addEventListener('click',()=>{speed=speed===1?.65:speed===.65?1.5:1;$('speed').textContent=speed+'×'});
document.addEventListener('visibilitychange',()=>{last=null});
function animate(now){if(last!==null&&!paused&&!document.hidden)elapsed+=Math.min((now-last)/1000,.05)*speed;last=now;render();requestAnimationFrame(animate)}
// Start with a visible, filled lifting pass; the following passes remain continuous.
elapsed=cycleDuration*.34;updateButton();render();requestAnimationFrame(animate);
</script>
