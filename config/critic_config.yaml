# Critic, continuous optimization, and template-memory policy.
#
# Archive admission is also template admission. The template quality settings
# below label high-potential examples; family/novelty limits affect retrieval
# only. Do not change the 78 threshold without score calibration.

schema_version: 4
critic_system_version: "4.3.0"
rubric_version: "academic_poster_multifamily_v5"

evaluators:
  render_artifacts:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    require_png: true
    require_pptx: true
  geometry:
    enabled: true
    version: "1.1.0"
    hard_gate: true
    bounds_tolerance_inches: 0.02
    overlap_area_tolerance: 0.02
    overlap_ratio_tolerance: 0.05
  grounding:
    enabled: true
    version: "1.0.0"
    hard_gate: true
  information_narrative:
    enabled: true
    version: "1.0.0"
    hard_gate: false
    semantic_enabled: true
    semantic_weight: 0.40
    preferred_evidence_coverage: 0.70
    maximum_words_per_claim: 45
  typography:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    minimum_body_font_size: 36
    minimum_section_title_font_size: 36
    minimum_title_font_size: 48
    section_to_body_ratio: 1.10
    title_to_section_ratio: 1.25
    maximum_emphasis_ratio: 0.35
    maximum_font_families: 2
  color_quality:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    minimum_contrast_ratio: 4.5
  visual_assets:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    maximum_aspect_deviation: 0.03
    minimum_effective_dpi: 72
  column_balance:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    maximum_utilization: 1.0
    preferred_minimum_utilization: 0.65
  section_fit:
    enabled: true
    version: "1.3.0"
    hard_gate: true
    planning_target: 0.975
    ideal_minimum: 0.95
    ideal_maximum: 1.0
    overflow_tolerance: 0.005
    strong_underuse_threshold: 0.90
    preferred_gap_body_lines: 1.0
    maximum_gap_body_lines: 1.5
    critical_gap_body_lines: 2.0
  content_adequacy:
    enabled: true
    version: "1.0.0"
    hard_gate: false
  layout_family:
    enabled: true
    version: "1.0.0"
    hard_gate: true
  visual:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    required_for_archive: true

dimensions:
  scientific_integrity:
    weight: 0.25
    minimum: 100
  content_quality:
    weight: 0.15
    minimum: 70
  layout_integrity:
    weight: 0.15
    minimum: 75
  readability:
    weight: 0.15
    minimum: 70
  visual_hierarchy:
    weight: 0.10
    minimum: 65
  visual_balance:
    weight: 0.10
    minimum: 65
  aesthetics:
    weight: 0.10
    minimum: 65

# Evaluator contributions are explicit and normalized per dimension. This
# prevents adding an evaluator from silently changing every score. Artifact
# validation is intentionally absent because it is a hard gate only.
dimension_sources:
  scientific_integrity:
    grounding: 1.00
  content_quality:
    information_narrative: 0.75
    content_adequacy: 0.25
  layout_integrity:
    geometry: 0.30
    column_balance: 0.20
    section_fit: 0.25
    layout_family: 0.25
  readability:
    typography: 0.35
    color_quality: 0.25
    visual: 0.40
  visual_hierarchy:
    typography: 0.20
    layout_family: 0.25
    visual: 0.55
  visual_balance:
    column_balance: 0.25
    section_fit: 0.25
    visual: 0.50
  aesthetics:
    color_quality: 0.30
    typography: 0.20
    visual_assets: 0.10
    visual: 0.40

archive_policy:
  minimum_overall_score: 78
  require_all_hard_gates: true
  require_dimension_minimums: true

loop:
  max_lineage_depth: 3
  retry_delay_seconds: 5
  in_memory_history_limit: 50
  timing_history_limit: 500
  strategy_weights:
    explore: 0.45
    adapt: 0.25
    hybridize: 0.30
  no_template_minimum_ratio: 0.40
  recent_template_window: 10
  checkpoint_every_iterations: 1
  session_template_free_warmup: 3

batch:
  default_mode: mixed
  default_iterations: 100
  count_only_committed_iterations: true

portfolio:
  max_active_lineages: 8
  stagnation_generations: 5
  mode_weights:
    explore: 0.45
    improve: 0.55
  force_explore_when_all_lineages_stagnated: true

improve_layout:
  local_geometry_candidates: 4
  max_preflight_recovery_attempts: 3
  preserve_parent_geometry_first: true

layout_families:
  schema_version: 2
  selection:
    version: 1
    # Applied only within the least-used family group; weights stay in [1, 1.5].
    semantic_bonus_max: 0.5
  minimum_seed_attempts_per_family: 2
  maximum_rolling_family_ratio: 0.20
  enabled:
    - classic_three_column
    - asymmetric_two_column
    - four_column_modular
    - central_hero_side_rails
    - top_hero_bottom_grid
    - horizontal_narrative_bands
    - method_flow_spine
    - comparison_split
    - result_dashboard_cards
    - small_multiples_matrix
    - timeline_stage_narrative
    - modular_editorial_mosaic

composition_refinement:
  enabled: true
  max_rounds: 2
  candidates_per_round: 4
  preferred_zone_gutter_body_lines: 0.5

layout_performance:
  enabled: true
  reuse_wrapping: true
  exact_cache_entries: 4096
  line_cache_entries: 8192
  wrap_cache_entries: 8192
  glyph_cache_entries: 16384
  font_cache_entries: 64
  max_text_payload_bytes: 33554432
  verbose_measurements: false

explore_layout:
  schema_version: 2
  max_geometry_candidates_per_family: 4
  max_adaptive_geometry_candidates: 12
  max_exact_candidates: 8
  max_exact_refill_steps: 24
  exact_diversity_score_window: 0.035
  max_family_attempts_per_iteration: 12
  beam_width: 4
  adaptive_beam_width: 8
  max_extra_claim_subsets_per_section: 12
  max_near_miss_rechecks: 2
  near_miss_max_overflow_inches: 2.0
  diverse_top_k: 2
  minimum_sections: 5
  planning_target: 0.975
  maximum_utilization: 1.0
  fast_measurement_safety_factor: 1.20
  promote_archetype_min_distinct_papers: 2
  promote_archetype_min_accepted_posters: 3

resume:
  default_mode: "latest"
  incomplete_iteration_policy: "retry_same_number"

content_optimization:
  enabled: true
  max_poster_actions_per_iteration: 2
  max_section_actions_per_iteration: 1
  reverse_action_cooldown_iterations: 3

capacity_repair:
  enabled: true
  active_utilization_threshold: 0.90
  large_bottom_gap_body_lines: 2.0
  max_visual_restore_attempts: 2
  max_visual_restore_attempts_per_iteration: 4
  max_whitespace_regression_fraction: 0.01
  max_gap_regression_inches: 0.35
  max_rounds_per_family: 2
  max_rounds_per_iteration: 4
  max_actions_per_round: 2
  max_repairable_overflow_inches: 2.0

templates:
  retrieval_limit: 3
  cooldown_iterations: 10
  max_campaign_cooldown_records: 128
  max_cross_paper_validation_attempts: 3
  novelty_distance_threshold: 0.08
  retrieval_slots_by_level:  # global per family; no borrowing across levels
    "0": 10
    "1": 10
    "2": 10
    "3": 10
  promotion_min_distinct_papers: 3
  promotion_min_distinct_profiles: 2
  robust_min_distinct_papers: 6
  robust_min_distinct_profiles: 3
  minimum_overall_score: 85  # high-potential label, not an admission gate
  dimension_minimums:
    content_quality: 80
    layout_integrity: 80
    readability: 75
    visual_hierarchy: 75
    visual_balance: 75
    aesthetics: 75
  require_ideal_section_fit: true
  require_no_major_issues: true

storage:
  root: "storage/critic_loop"
  max_render_fit_previews_per_iteration: 3
  remove_rejected_pptx: true
  remove_rejected_png: true
