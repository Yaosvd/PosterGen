# Model-scored Critic and shared Explore fitting measurements.
# Reference thresholds describe quality; every final poster is saved.

schema_version: 7
critic_system_version: "7.2.0"
rubric_version: "academic_poster_editorial_v4_model_scored"

# Independent samples only. SDK retries are disabled; read timeouts never replay.
sample_execution:
  response_timeout_seconds: 900
  max_transient_retries: 1
  max_curation_revisions: 1  # Separate durable sample budget, never debits four content-repair rounds.

evaluators:
  render_artifacts:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    require_png: true
    require_pptx: true
  geometry:
    enabled: true
    version: "1.1.0"
    hard_gate: true
    bounds_tolerance_inches: 0.02
    overlap_area_tolerance: 0.02
    overlap_ratio_tolerance: 0.05
  grounding:
    enabled: true
    version: "1.0.0"
    hard_gate: true
  information_narrative:
    enabled: true
    version: "1.5.1"
    hard_gate: false
  typography:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    minimum_body_font_size: 36
    minimum_section_title_font_size: 36
    minimum_title_font_size: 48
    section_to_body_ratio: 1.10
    title_to_section_ratio: 1.25
    maximum_emphasis_ratio: 0.35
    maximum_font_families: 2
  color_quality:
    enabled: true
    version: "1.1.0"
    hard_gate: true
    minimum_contrast_ratio: 4.5
  visual_assets:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    maximum_aspect_deviation: 0.03
    minimum_effective_dpi: 72
  column_balance:
    enabled: true
    version: "1.0.0"
    hard_gate: true
    maximum_utilization: 1.0
    preferred_minimum_utilization: 0.65
  section_fit:
    enabled: true
    version: "1.3.0"
    hard_gate: true
    planning_target: 0.975
    ideal_minimum: 0.90
    ideal_maximum: 1.0
    overflow_tolerance: 0.005
    strong_underuse_threshold: 0.90
    preferred_gap_body_lines: 1.0
    maximum_gap_body_lines: 1.5
    critical_gap_body_lines: 2.0
  layout_family:
    enabled: true
    version: "1.2.1"
    hard_gate: true
  visual:
    enabled: true
    version: "1.0.0"
    hard_gate: true

dimensions:
  scientific_integrity:
    minimum: 100
  content_quality:
    minimum: 70
  layout_integrity:
    minimum: 75
  readability:
    minimum: 70
  visual_hierarchy:
    minimum: 65
  visual_balance:
    minimum: 65
  aesthetics:
    minimum: 65

quality_reference:
  minimum_overall_score: 78
  require_all_hard_gates: true
  require_dimension_minimums: true

# All quality leaves are model judgments; weights below are the only scoring policy.
editorial_scoring:
  method: model_submetrics_v1
  schema_version: 7
  critic_system_version: "7.2.0"
  rubric_version: "academic_poster_editorial_v4_model_scored"
  dimensions:
    scientific_integrity:
      weight: 0.25
      submetrics:
        scientific_integrity: 1.0
    content_quality:
      weight: 0.20
      submetrics:
        information_coverage: 0.25
        information_completeness: 0.25
        narrative_flow: 0.15
        information_depth: 0.15
        narrative_structure: 0.10
        information_layering: 0.05
        narrative_conciseness: 0.05
    layout_integrity:
      weight: 0.20
      submetrics:
        layout_robustness: 0.45
        layout_structure: 0.45
        element_alignment: 0.10
    readability:
      weight: 0.10
      submetrics:
        font_legibility: 0.70
        color_contrast: 0.30
    visual_hierarchy:
      weight: 0.15
      submetrics:
        reading_order_quality: 0.60
        primary_anchor: 0.20
        font_hierarchy: 0.15
        font_emphasis: 0.05
    visual_balance:
      weight: 0.05
      submetrics:
        whitespace_quality: 0.60
        compositional_balance: 0.40
    aesthetics:
      weight: 0.05
      submetrics:
        color_palette: 0.40
        visual_relevance: 0.30
        color_hierarchy: 0.20
        color_source: 0.10





layout_families:
  schema_version: 2
  selection:
    version: 2
    # Applied only within the least-used family group; weights stay in [1, 1.5].
    semantic_bonus_max: 0.5
  enabled:
    - classic_three_column
    - asymmetric_two_column
    - four_column_modular
    - central_hero_side_rails
    - top_hero_bottom_grid
    - horizontal_narrative_bands
    - method_flow_spine
    - comparison_split
    - result_dashboard_cards
    - small_multiples_matrix
    - timeline_stage_narrative
    - modular_editorial_mosaic
    - framed_multicolumn
    - narrative_evidence_grid
    - central_evidence_band

poster_editorial:
  enabled: true
  # Design heuristic for panel visibility, separate from text WCAG contrast.
  minimum_panel_canvas_contrast: 1.12

composition_refinement:
  enabled: true
  max_rounds: 2
  candidates_per_round: 4
  preferred_zone_gutter_body_lines: 0.5

layout_performance:
  enabled: true
  reuse_wrapping: true
  exact_cache_entries: 4096
  line_cache_entries: 8192
  wrap_cache_entries: 8192
  glyph_cache_entries: 16384
  font_cache_entries: 64
  max_text_payload_bytes: 33554432
  verbose_measurements: false

explore_layout:
  schema_version: 2
  max_geometry_candidates_per_family: 4
  max_adaptive_geometry_candidates: 12
  max_exact_candidates: 8
  max_exact_refill_steps: 24
  exact_diversity_score_window: 0.035
  max_family_attempts_per_iteration: 15  # legacy interfaces; v7 samples always freeze ONE family
  beam_width: 4
  adaptive_beam_width: 8
  max_extra_claim_subsets_per_section: 12
  max_near_miss_rechecks: 2
  near_miss_max_overflow_inches: 2.0
  diverse_top_k: 2
  minimum_sections: 5
  planning_target: 0.975
  maximum_utilization: 1.0
  fast_measurement_safety_factor: 1.20


content_optimization:
  enabled: true
  max_poster_actions_per_iteration: 2
  max_section_actions_per_iteration: 1
  reverse_action_cooldown_iterations: 3

capacity_repair:
  enabled: true
  active_utilization_threshold: 0.90
  large_bottom_gap_body_lines: 2.0
  max_visual_restore_attempts: 2
  max_visual_restore_attempts_per_iteration: 4
  max_whitespace_regression_fraction: 0.01
  max_gap_regression_inches: 0.35
  max_rounds_per_family: 2  # legacy repair helpers; v7 uses its sample-wide policy below
  max_rounds_per_iteration: 4
  quality_reserved_rounds: 1
  require_progress_for_second_round: true
  max_actions_per_round: 2
  max_repairable_overflow_inches: 2.0

# Independent sample preparation owns these sample-wide bounds. Legacy capacity
# repair settings above remain available to the independent classic interfaces.
sample_joint_preparation:
  version: 1
  max_edit_rounds: 4
  max_capacity_rounds: 3
  max_quality_rounds: 1
  max_modules_per_edit: 2
